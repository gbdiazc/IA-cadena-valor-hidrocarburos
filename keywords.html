<style>
  #_pub-panel {
    display: none; position: fixed;
    top: 80px; right: 20px; z-index: 1000;
  }
  #_pub-panel button {
    display: inline-block; background: #00695C; color: white;
    padding: 9px 20px; border-radius: 5px; border: none;
    font-weight: bold; font-size: 13px; cursor: pointer;
    font-family: Arial, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  #_pub-panel button:hover { opacity: 0.88; }
</style>
<div id="_pub-panel"><button id="_btn-abrir">Abrir artículo</button></div>
<script>
(function() {
  var panel = document.getElementById('_pub-panel');
  var btn   = document.getElementById('_btn-abrir');
  var curUrl = '';
  btn.addEventListener('click', function() {
    if (curUrl) window.open(curUrl, '_blank', 'width=1000,height=800,noopener,noreferrer');
  });
  function init() {
    var plotDiv = document.querySelector('.js-plotly-plot');
    if (!plotDiv) { setTimeout(init, 300); return; }
    plotDiv.on('plotly_click', function(ev) {
      if (!ev || !ev.points || !ev.points.length) return;
      var cd  = ev.points[0].customdata;
      var url = (cd && cd[0]) ? String(cd[0]) : '';
      if (url.indexOf('http') === 0) { curUrl = url; panel.style.display = 'block'; }
      else { curUrl = ''; panel.style.display = 'none'; }
    });
    plotDiv.on('plotly_relayout', function() {
      curUrl = ''; panel.style.display = 'none';
    });
    document.addEventListener('click', function(e) {
      if (panel.style.display === 'block' &&
          !panel.contains(e.target) && !e.target.closest('.js-plotly-plot')) {
        curUrl = ''; panel.style.display = 'none';
      }
    });
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
