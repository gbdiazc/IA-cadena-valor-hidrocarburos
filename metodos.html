<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Métodos de IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: the user's infographic is the base; transparent hotspots over each box open a side drawer with subcategories (accordion) -> methods */
:root{--bg:#fff;--fg:#17212b;--mut:#5d6b78;--line:#dde4ea;--soft:#f5f8fa;
--ml:#2a72c9;--cv:#d6940f;--kb:#2b8f4a;--rb:#e0631c;--op:#7448c9;--gen:#d63d63;--dt:#1a8fb8;--tr:#3f5a74;--hub:#1f5f94;
--disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1340px;margin:0 auto;display:grid;gap:10px}
h1{font:700 1.9rem var(--disp);margin:0;text-align:center;line-height:1.05;text-wrap:balance}
.sub{color:var(--mut);font-size:.85rem;margin:0;text-align:center}
.base{position:relative;width:100%;max-width:1327px;margin:0 auto}
.base img{display:block;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;border-radius:16px;cursor:pointer;padding:0;transition:background .15s,box-shadow .15s}
.hot:hover,.hot:focus-visible{background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:0 0 0 3px var(--c);outline:none}
.hot.round{border-radius:50%}
.hot.sel{box-shadow:0 0 0 4px var(--c);background:color-mix(in srgb,var(--c) 8%,transparent)}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:21;overflow-y:auto;display:grid;align-content:start;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(10,20,30,.15)}
.dh{position:sticky;top:0;z-index:1;background:var(--c);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 14px 20px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.dh h2{margin:0;font:700 1.75rem/1.05 var(--disp)}
.dh p{margin:0;grid-column:1/-1;font-size:.88rem;opacity:.95}
.x{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font:500 .8rem var(--body)}
.x:focus-visible{outline:2px solid #fff}
.db{padding:14px max(20px,env(safe-area-inset-right,0px)) 30px 20px;display:grid;gap:8px}
.hint{font-size:.78rem;color:var(--mut);margin:0 0 2px}
.s{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.s.open{border-color:var(--c)}
.s>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:10px 1fr 20px;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;font:600 .95rem var(--body)}
.s>button:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.s>button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.s>button svg{width:20px;height:20px;color:var(--c);transition:transform .2s}
.s.open>button{background:color-mix(in srgb,var(--c) 9%,#fff)}
.s.open>button svg{transform:rotate(180deg)}
.sb{padding:4px 14px 12px 32px;display:grid;gap:8px}
.sb>p{margin:0;font-size:.86rem;color:var(--mut)}
.mt{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mt li{background:var(--soft);border-left:3px solid var(--c);border-radius:0 8px 8px 0;padding:7px 10px;font-size:.84rem}
.mt li b{display:block;font-weight:600;color:var(--fg);margin-bottom:1px}
.note{font-size:.72rem;color:var(--mut);text-align:center;margin:4px 0 0}
</style>
</head>
<body>
