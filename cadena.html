<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA en la Cadena de Hidrocarburos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: the value-chain image is the navigation; tool filter above, application cards below, detail drawer on the side */
:root{--bg:#ffffff;--panel:#f6f9fa;--fg:#17212b;--mut:#5d6b78;--line:#d9e1e6;--acc:#1c7a86;
--s0:#1b3f8b;--s1:#1f5fb5;--s2:#1e6fa8;--s3:#1c7a86;--s4:#1e8a6e;--s5:#2c8f4a;--s6:#2e8b3a;--s7:#5a6b78;
--disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:12px}
h1{font:700 1.7rem var(--disp);margin:0;text-align:center;text-wrap:balance}
.sub{color:var(--mut);font-size:.82rem;text-align:center;margin:.2rem auto 0;max-width:72ch}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tools span{font:600 .72rem var(--body);color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin-right:4px}
.chip{border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:4px 11px;font:500 .78rem var(--body);cursor:pointer}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chain{position:relative;overflow:hidden}
.chain-in{position:relative}
.chain img{display:block;width:100%;height:auto}
.hot{position:absolute;top:0;bottom:0;border:0;background:transparent;cursor:pointer;border-radius:14px;transition:background .15s}
.hot:hover{background:rgba(28,122,134,.08)}
.hot.sel{background:rgba(28,122,134,.12);box-shadow:inset 0 0 0 2px var(--acc)}
.hot.dim{background:rgba(255,255,255,.72)}
.hot .n{position:absolute;top:4px;right:10px;background:var(--acc);color:#fff;font:600 .7rem var(--body);border-radius:999px;padding:1px 7px}
.trans{display:flex;justify-content:center}
.trans .chip{border-style:dashed;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.panel h2{margin:0;font:700 1.45rem var(--disp);display:flex;align-items:center;gap:10px}
.panel h2 i{width:12px;height:12px;border-radius:50%;display:inline-block}
.panel p{margin:.15rem 0 12px;color:var(--mut);font-size:.84rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{border:1px solid var(--line);border-left:5px solid;border-radius:8px;background:#fff;padding:7px 10px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:grid;gap:4px;align-content:start}
.card:hover{border-color:var(--acc)}
.card .tl{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ap{font:600 1.05rem var(--disp);line-height:1.15}
.card .q{font-size:.8rem;color:var(--mut)}
.card .tr{font-size:.72rem;color:var(--mut)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:#fff;z-index:21;overflow-y:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 30px 22px;padding-top:calc(22px + env(safe-area-inset-top,0px));display:grid;gap:12px;align-content:start;border-left:1px solid var(--line)}
.drawer h2{font:700 1.8rem var(--disp);line-height:1.05;margin:0}
.k{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.07em}
dl{display:grid;gap:12px;margin:0}dt{font:600 .7rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}dd{margin:2px 0 0}
dd a{color:var(--acc);word-break:break-all}
.tags{display:flex;flex-wrap:wrap;gap:5px}.tags span{font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.x{justify-self:end;border:1px solid var(--line);background:none;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--fg)}
.note{font-size:.72rem;color:var(--mut);text-align:center;margin:0}
@media(max-width:640px){
  .chain{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .chain-in{min-width:640px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))!important}
  .chip{padding:3px 9px;font-size:.74rem}
  .tools span{font-size:.68rem}
  .card .ap{font-size:.95rem}
  .drawer{width:100%}
  h1{font-size:1.35rem}
}
@media(max-width:400px){
  .grid{grid-template-columns:1fr 1fr!important}
}

 CX.forEach((x,i)=>{const n=tool?D.filter(d=>d.s==i&&mt(d)).length:0;

}
function det(i){const x=D[i];
 $("dr").innerHTML=`<button class="x" id="cx">Cerrar</button><div class="k" style="color:var(--s${x.s})">${esc(STG[x.s])}</div>${x.imp?'<div class="implogo" role="img" aria-label="Instituto Mexicano del Petróleo"></div>':""}<h2>${esc(x.a)}</h2>

 $("dr").hidden=$("scrim").hidden=false;$("cx").focus();$("cx").onclick=close}
function close(){$("dr").hidden=$("scrim").hidden=true}
function render(){tools();chain();panel()}
document.addEventListener("click",e=>{const i=e.target.closest("[data-i]"),h=e.target.closest(".hot"),f=e.target.closest("[data-f]");
 if(i)return det(+i.dataset.i);
 if(h){tool=null;st=+h.dataset.s;render();return}
 if(f){tool=tool==f.dataset.f?null:f.dataset.f;render();return}
 if(e.target.id=="t7"){tool=null;st=7;render()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
